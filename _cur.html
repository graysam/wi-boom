<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PeRci</title>
  <link rel="preload" as="script" href="app.js">
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#0b1021;color:#e8f0ff;font:16px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    .wrap{display:flex;flex-direction:column;align-items:center;min-height:100%;padding:16px 16px 72px}
    .top{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;margin-top:12px}
    .logo{height:80px;margin:8px auto 12px auto}
    .logo-text{font-weight:900;font-size:28px;letter-spacing:.08em}
    .panel{width:100%;max-width:520px;background:#11162d;border-radius:16px;padding:16px;margin:8px 0;box-shadow:0 6px 24px rgba(0,0,0,.30)}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    label{display:block;font-weight:700;color:#9fb6ff}
    input[type=range]{width:100%}
    .val{min-width:62px;text-align:center;padding:6px 10px;border-radius:8px;background:#0b1021;color:#e8f0ff;font-weight:800}
    .grid{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;align-items:center}
    .grid .row{grid-column:1/-1}
    .hint{opacity:.6}
    .controls{width:100%;max-width:520px;}
    .btn{padding:12px 18px;border:0;border-radius:10px;background:#223; color:#cfe3ff; font-weight:800; cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .btn.primary{background:#19c37d;color:#03152b}
    .btn.danger{background:#ff4d4d;color:#3a0000}
    .actions{display:flex;gap:12px;justify-content:center;margin-top:12px}
    #fire{margin:18px auto;border-radius:50%;width:220px;height:220px;background:#ff4d4d;color:#fff;font-size:2rem;border:none;opacity:.65;font-weight:900;letter-spacing:.05em}
    #fire.enabled{opacity:1}
    #fire span{display:block;font-size:14px;font-weight:700;opacity:.9}
    .statusbar{position:fixed;left:0;right:0;bottom:26px;height:34px;background:#0b1021;color:#e8f0ff;display:flex;align-items:center;justify-content:center;font:14px/1.2 ui-monospace,Consolas,monospace;gap:16px}
    .infobar{position:fixed;left:0;right:0;bottom:0;height:24px;background:#0b0f22;color:#9fb6ff;display:flex;align-items:center;justify-content:center;font:12px/1.2 ui-monospace,Consolas,monospace}
    .led{width:12px;height:12px;border-radius:50%;background:#711;box-shadow:0 0 0 2px rgba(255,255,255,.06) inset,0 0 8px rgba(0,0,0,.4)}
    .green{background:#19c37d}
    .amber{background:#ffb000}
    .red{background:#ff4d4d}
    .blink{animation:blink 1s infinite ease-in-out}
    @keyframes blink{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
    .veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;letter-spacing:.1em}
    .hidden{display:none}
    a, a:visited{color:#9fb6ff}
  </style>
</head>
<body>
  <div id="veil" class="veil hidden">RECONNECTING...</div>
  <div class="wrap">
    <div class="top">
      <img id="logo" class="logo" alt="PeRci">
      <div class="logo-text" id="logoText">PeRci</div>
    </div>

    <div class="panel controls">
      <div class="grid">
        <label for="timer">Timer</label>
        <div class="row"><input id="timer" type="checkbox"> <span class="hint">Delay before firing</span></div>

        <label for="tmm">Duration</label>
        <div class="row"><input id="tmm" type="number" min="0" max="59" value="0" class="val"> : <input id="tss" type="number" min="0" max="59" value="10" class="val"></div>

        <label for="count">Count</label>
        <div class="row"><div id="valCount" class="val">1</div> <input id="count" type="range" min="1" max="10" value="1"></div>

        <label for="rate">Rate (Hz)</label>
        <div class="row"><div id="valRate" class="val">10</div> <input id="rate" type="range" min="2" max="150" value="10"></div>

        <label for="repeats">Repeats</label>
        <div class="row"><div id="valReps" class="val">1</div> <input id="repeats" type="range" min="1" max="6" value="1"></div>

        <label for="repSpa" id="lblRepSpa">Repeat Spacing (ms)</label>
        <div class="row"><div id="valSpa" class="val">500</div> <input id="repSpa" type="range" min="100" max="3000" value="500"></div>

        <label for="continuous">Continuous</label>
        <div class="row"><input id="continuous" type="checkbox"> <span class="hint">Fire continuously at rate; Fire toggles start/stop</span></div>
      </div>
    </div>

    <button id="fire" class="danger" disabled>FIRE <span id="countdown"></span></button>
    <div class="actions">
      <button id="arm" class="btn primary">ARM</button>
      <button id="disarm" class="btn">DISARM</button>
      <a class="btn" href="/admin">Settings</a>
    </div>
  </div>

  <div class="statusbar">
    <span><span class="led red" id="ledWs"></span> WS</span>
    <span><span class="led red" id="ledArmed"></span> ARMED</span>
    <span id="apName" class="hint">AP</span>
  </div>
  <div class="infobar" id="infobar">Idle.</div>

  <script src="app.js"></script>
