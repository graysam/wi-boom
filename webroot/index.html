<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PeRci</title>
  <link rel="preload" as="script" href="app.js">
  <style>
    :root{ --brandW: 72px; --vspace: clamp(4px, 1.4vh, 12px); --gap: clamp(6px, 1.2vh, 14px); --bg:#0f1730; --panel:#151e3a; --bar:#0a132a }
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#e8f0ff;font:14px/1.35 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    .wrap{display:flex;flex-direction:column;min-height:100%;padding:8px 10px 66px}

    /* Top control square layout */
    .topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .sq{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,.28);overflow:hidden}
    .leftstack{display:flex;flex-direction:column}
    .leftstack .half{flex:1 1 50%;display:flex;align-items:center;justify-content:center}
    .btn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#cfe3ff;font-weight:900;letter-spacing:.08em;cursor:pointer}
    .btn.arm{background:#19c37d;color:#03152b}
    .btn.disarm{background:#223}
    .btn.arm:active{filter:brightness(0.92)}
    .btn.disarm:active{filter:brightness(1.1)}

    #fire{width:100%;height:100%;border:0;background:#ff4d4d;color:#fff;font-weight:900;letter-spacing:.06em;font-size:clamp(20px,6vw,28px);cursor:pointer}
    #fire:active{filter:brightness(0.92)}
    #countdown{display:block;font-size:clamp(18px,7vw,30px);font-weight:900;opacity:.95}
    .armed #fire{animation:breathe 3.2s ease-in-out infinite}
    @keyframes breathe{0%{box-shadow:0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 0 10px rgba(255,77,77,.12)}100%{box-shadow:0 0 0 rgba(255,77,77,0)}}

    /* Controls panel: compact, inline values */
    .panel{width:100%;background:var(--panel);border-radius:14px;padding:clamp(8px,1.2vh,14px);margin:8px 0;box-shadow:0 4px 16px rgba(0,0,0,.28)}
    .row{display:grid;grid-template-columns:110px 1fr auto;gap:var(--gap);align-items:center;margin:var(--vspace) 0}
    .row label{color:#9fb6ff;font-weight:700}
    input[type=range]{width:100%;height:26px}
    .val{min-width:54px;text-align:center;padding:5px 8px;border-radius:8px;background:#0b1021;color:#e8f0ff;font-weight:800}
    .hint{opacity:.65}

    /* Status bar with compact logo */
    .statusbar{position:fixed;left:0;right:0;bottom:24px;height:34px;background:var(--bar);color:#e8f0ff;display:flex;align-items:center;justify-content:center;font:12px/1.2 ui-monospace,Consolas,monospace;gap:14px;padding:0 calc(8px + var(--brandW)) 0 8px}
    .brand{position:fixed;left:8px;bottom:0;height:58px;width:var(--brandW);display:flex;align-items:center;justify-content:center}
    .brand img{height:58px;display:block}
    .led{width:11px;height:11px;border-radius:50%;background:#711;box-shadow:0 0 0 2px rgba(255,255,255,.06) inset,0 0 6px rgba(0,0,0,.35)}
    .green{background:#19c37d}
    .amber{background:#ffb000}
    .red{background:#ff4d4d}
    .blink{animation:blink 1s infinite ease-in-out}
    @keyframes blink{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
    .infobar{position:fixed;left:0;right:0;bottom:0;height:24px;background:#0c1531;color:#9fb6ff;display:flex;align-items:center;justify-content:center;font:11px/1.2 ui-monospace,Consolas,monospace;padding-left:calc(8px + var(--brandW))}

    /* Floating settings gear */
    .gear{position:fixed;right:10px;bottom:66px;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);color:#cfe3ff;z-index:1001}
    .gear svg{width:18px;height:18px;display:block}
    .gear:active{filter:brightness(1.1)}

    /* Veil overlay */
    .veil{position:fixed;inset:0;background:rgba(10,16,33,.72);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;letter-spacing:.12em;z-index:1000;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
    .hidden{display:none}

    /* Prevent accidental zoom/scroll and handle safe areas */
    @supports(padding:max(env(safe-area-inset-bottom))){ .wrap{padding-bottom:calc(66px + env(safe-area-inset-bottom))} }
  </style>
</head>
<body>
  <div id="veil" class="veil hidden">RECONNECTING...</div>
  <div class="wrap">
    <div class="topbar">
      <div class="sq leftstack">
        <div class="half"><button id="arm" class="btn arm">ARM</button></div>
        <div class="half"><button id="disarm" class="btn disarm">DISARM</button></div>
      </div>
      <div class="sq"><button id="fire" disabled>FIRE <span id="countdown"></span></button></div>
    </div>

    <div class="panel controls">
      <div class="row"><label for="timer">Timer</label><input id="timer" type="checkbox"><div class="hint">Delay before firing</div></div>
      <div class="row"><label for="tmm">Duration</label>
        <div class="row" style="grid-column: 2 / -1; grid-template-columns: 1fr 10px 1fr; gap:6px;">
          <input id="tmm" type="number" min="0" max="59" value="0" class="val"> <div class="hint" style="text-align:center;">:</div> <input id="tss" type="number" min="0" max="59" value="10" class="val">
        </div>
      </div>
      <div class="row"><label for="count">Count</label><input id="count" type="range" min="1" max="10" value="1"><div id="valCount" class="val">1</div></div>
      <div class="row"><label for="rate">Rate (Hz)</label><input id="rate" type="range" min="2" max="150" value="10"><div id="valRate" class="val">10</div></div>
      <div class="row"><label for="repeats">Repeats</label><input id="repeats" type="range" min="1" max="6" value="1"><div id="valReps" class="val">1</div></div>
      <div class="row"><label for="repSpa" id="lblRepSpa">Repeat Spacing</label><input id="repSpa" type="range" min="100" max="3000" value="500"><div id="valSpa" class="val">500</div></div>
      <div class="row"><label for="continuous">Continuous</label><input id="continuous" type="checkbox"><div class="hint">Fire continuously; Fire toggles start/stop</div></div>
    </div>
  </div>

  <div class="brand"><img id="logo" alt="PeRci"></div>
  <div class="statusbar">
    <span class="hint" id="apName">AP</span>
    <span><span class="led red" id="ledWs"></span> WS</span>
    <span><span class="led red" id="ledArmed"></span> ARMED</span>
  </div>
  <div class="infobar" id="infobar">Idle.</div>

  <a class="gear" href="/admin" aria-label="Settings">
    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 48 48">

</svg>
  </a>
